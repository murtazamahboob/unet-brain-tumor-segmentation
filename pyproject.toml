[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-brain-tumor-segmentation"
version = "1.0.0"
description = "Brain-tumour MRI segmentation with a U-Net implemented from scratch in pure NumPy — synthetic data, training, Dice evaluation and visual reports. No PyTorch, no GPU."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Murtaza Mahboob" }]
keywords = [
    "unet",
    "brain-tumor-segmentation",
    "medical-image-segmentation",
    "deep-learning",
    "numpy",
    "mri",
    "computer-vision",
    "opencv",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "matplotlib==3.8.4",
    "Pillow==10.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
brainseg = "brainseg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
